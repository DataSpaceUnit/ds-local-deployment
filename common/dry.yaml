apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: common-srvs-minio-console
  labels:
    app: minio
    chart: minio-5.2.0
    release: common-srvs
    heritage: Helm
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: common-srvs-minio-console
                port: 
                  number: 9001
      host: "console.minio-s3.dev.ed.dataspaceunit.linkeddata.es"
