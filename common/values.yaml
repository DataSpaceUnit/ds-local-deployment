postgresql:
  image:
    repository: bitnamilegacy/postgresql
    tag: 16.3.0-debian-12-r9
  auth:
    postgresPassword: aPassword1234
    # We initially setup the database for keycloak
    username: keycloak
    password: aPassword1234
    database: keycloak
  primary:
    persistence:
      enabled: true
      storageClass: local-path
      size: 4Gi
keycloak:
  production: true
  tls:
    enabled: false
    # autoGenerated: true
  proxy: edge
  # extraEnvVars:
  #   - name: KEYCLOAK_PROXY
  #     value: edge
  #   - name: KEYCLOAK_ENABLE_HTTPS
  #     value: "false"
  #   - name: KEYCLOAK_HOSTNAME
  #     value: keycloak.dev.ed.dataspaceunit.linkeddata.es
  #   - name: KEYCLOAK_HOSTNAME_ADMIN
  #     value: keycloak-admin.dev.ed.dataspaceunit.linkeddata.es
  #   - name: KEYCLOAK_HOSTNAME_STRICT
  #     value: "false"
  #   - name: KEYCLOAK_HOSTNAME_STRICT_HTTPS
  #     value: "false"
  image:
    repository: bitnamilegacy/keycloak
    tag: 24.0.4-debian-12-r1
  auth:
    adminUser: admin
    adminPassword: aPassword1234
  postgresql:
    enabled: false
  externalDatabase:
    host: "{{ .Release.Name }}-postgresql"
    user: keycloak
    password: aPassword1234
    database: keycloak
    port: 5432
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname:  keycloak.dev.ed.dataspaceunit.linkeddata.es #keycloak.dev.ed.dataspaceunit.linkeddata.es
  adminIngress:
    enabled: true
    ingressClassName: nginx
    hostname: keycloak-admin.dev.ed.dataspaceunit.linkeddata.es
  keycloakConfigCli:
    image:
      repository: bitnamilegacy/keycloak-config-cli
      tag: 5.12.0-debian-12-r4
    enabled: true
    extraEnv:
      - name: KEYCLOAK_USER
        value: admin
      - name: KEYCLOAK_PASSWORD
        value: aPassword1234
      - name: KEYCLOAK_PROXY
        value: edge
      - name: KEYCLOAK_ENABLE_HTTPS
        value: "false"
      - name: KEYCLOAK_HOSTNAME
        value: keycloak.dev.ed.dataspaceunit.linkeddata.es
      - name: KEYCLOAK_HOSTNAME_ADMIN
        value: keycloak-admin.dev.ed.dataspaceunit.linkeddata.es
      - name: KEYCLOAK_HOSTNAME_STRICT
        value: "false"
      - name: KEYCLOAK_HOSTNAME_STRICT_HTTPS
        value: "false"

      # - name: KC_HTTP_ENABLED
      #   value: true 
      # - name: KC_HOSTNAME_STRICT_HTTPS
      #   value: false
      # - name: KC_PROXY_HEADERS
      #   value: xforwarded
      # - name: KC_PROXY_ADDRESS_FORWARDING
      #   value: true
      # - name: KC_HOSTNAME
      #   value: https://keycloak-admin.dev.ed.dataspaceunit.linkeddata.es
      # - name: KC_PROXY
      #   value: edge
      # - name: KEYCLOAK_ENABLE_HTTPS
      #   value: false
    configuration:
      master.json: |
        {
          "realm" : "master",
          "attributes": {
            "frontendUrl": "https://keycloak-admin.dev.ed.dataspaceunit.linkeddata.es",
            "redirectUri": "https://keycloak-admin.dev.ed.dataspaceunit.linkeddata.es/*"
          }
        }
minio:
  mode: standalone
  rootUser: admin
  rootPassword: aPassword1234
  replicas: 1
  persistence:
    enabled: false
    # storageClass: local-path
    # size: 2Gi
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - minio.dev.ed.dataspaceunit.linkeddata.es
  consoleIngress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - console.minio-s3.dev.ed.dataspaceunit.linkeddata.es
  resources:
    requests:
      memory: 2Gi
      cpu: 1000m
    limits:
      memory: 4Gi
      cpu: 2000m
vault:
  serviceAccount:
    create: true
    name: vault
  server:
    dataStorage:
      enabled: true
      size: 2Gi
      storageClass: local-path
  injector:
    enabled: false